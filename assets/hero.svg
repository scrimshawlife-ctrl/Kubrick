<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Background -->
  <rect width="1280" height="640" fill="#0a0c10"/>
  
  <!-- Subtle grid / urban geometry (Layout layer) -->
  <g stroke="#1a1f2e" stroke-width="1" opacity="0.6">
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>
  
  <!-- Threshold / convergence zone (horizontal band) -->
  <rect x="0" y="290" width="1280" height="60" fill="#11151f" opacity="0.85"/>
  
  <!-- Active edge / liminal line -->
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#3a4a6e" stroke-width="3"/>
  
  <!-- Figure (silhouette, right third, weight on back leg) -->
  <g transform="translate(820, 180)">
    <!-- Head -->
    <circle cx="30" cy="40" r="22" fill="#1f2738"/>
    <!-- Body / coat -->
    <path d="M10 65 Q30 90 50 65 L55 140 Q30 160 5 140 Z" fill="#1f2738"/>
    <!-- Arm / object -->
    <line x1="55" y1="85" x2="85" y2="105" stroke="#3a4a6e" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="25" y1="130" x2="18" y2="200" stroke="#1f2738" stroke-width="9"/>
    <line x1="35" y1="130" x2="48" y2="200" stroke="#1f2738" stroke-width="9"/>
  </g>
  
  <!-- Convergence point (foot + object shadow + line) -->
  <g>
    <!-- Older trace -->
    <ellipse cx="780" cy="318" rx="95" ry="8" fill="#2a344a" opacity="0.5"/>
    <!-- Active softened trace / erasure zone -->
    <ellipse cx="880" cy="322" rx="70" ry="7" fill="#2f3a52" opacity="0.7"/>
    <!-- Shadow from figure/object -->
    <ellipse cx="900" cy="325" rx="55" ry="6" fill="#1a1f2e" opacity="0.85"/>
    <!-- Small disturbance (witness object mark) -->
    <circle cx="865" cy="320" r="4" fill="#3a4a6e"/>
  </g>
  
  <!-- Light duality -->
  <!-- Hard rim / preservation -->
  <path d="M800 200 Q820 160 850 195" fill="none" stroke="#5a6a8a" stroke-width="4" opacity="0.7"/>
  <!-- Soft dissolution / fill -->
  <path d="M830 280 Q880 310 920 295" fill="none" stroke="#2a354f" stroke-width="18" opacity="0.4"/>
  
  <!-- Title -->
  <text x="640" y="140" font-family="monospace" font-size="72" font-weight="700" fill="#e8e9ed" text-anchor="middle" letter-spacing="-3">KUBRICK</text>
  
  <!-- Subtitle -->
  <text x="640" y="185" font-family="monospace" font-size="22" fill="#6b7a9a" text-anchor="middle" letter-spacing="6">SYMBOLIC CINEMATIC NARRATIVE ENGINEERING</text>
  
  <!-- Tagline -->
  <text x="640" y="420" font-family="monospace" font-size="18" fill="#4a5a7a" text-anchor="middle">0.10.0 • Neuro-Symbolic • Latent Graph • Disentangled Systems</text>
  
  <!-- Bottom accent line -->
  <line x1="200" y1="460" x2="1080" y2="460" stroke="#2a344a" stroke-width="1"/>
  
  <!-- Small symbolic marks (residue / trace) -->
  <circle cx="250" cy="470" r="2" fill="#3a4a6e"/>
  <circle cx="260" cy="475" r="1.5" fill="#3a4a6e"/>
  <circle cx="1020" cy="468" r="2.5" fill="#3a4a6e"/>
</svg>
