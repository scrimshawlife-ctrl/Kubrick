name: Hermes Skill Evals
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/run_hermes_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubrick-eval-report
          path: out/kubrick/eval-report.json
