name: OpenClaw v0.13 Evals
on:
  push:
    branches: [openclaw]
  pull_request:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v evals/test_openclaw_portability.py
      - run: python scripts/doctor.py
      - run: python scripts/run_hermes_evals.py
      - run: python scripts/test_outcome_governance.py
      - run: python scripts/test_wave2_wave3.py
      - name: Compile canonical storyboard example
        run: |
          python scripts/kubrick.py do compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider grok-imagine --out out/kubrick/example
      - name: Compile multi-provider adapter packets
        run: |
          python scripts/kubrick.py do compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider flux --out out/kubrick/example-flux
          python scripts/kubrick.py do compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider sd3 --out out/kubrick/example-sd3
          python scripts/kubrick.py do compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider midjourney --out out/kubrick/example-midjourney
      - name: Verify deterministic repeatability
        run: python scripts/kubrick.py do check --action repeatability --output out/kubrick/repeatability-report.json
      - name: Verify release version alignment
        run: python scripts/audit_release_version.py --strict --output out/kubrick/release-version-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubrick-eval-report
          path: out/kubrick/
